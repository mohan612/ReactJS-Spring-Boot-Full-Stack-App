version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: hobbie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hobbie_db
      MYSQL_USER: hobbie_user
      MYSQL_PASSWORD: hobbie_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - hobbie-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend Microservice
  spring-backend:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    container_name: hobbie-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hobbie_db
      - SPRING_DATASOURCE_USERNAME=hobbie_user
      - SPRING_DATASOURCE_PASSWORD=hobbie_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hobbie-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend Microservice
  react-frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: hobbie-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      spring-backend:
        condition: service_healthy
    networks:
      - hobbie-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Networks
networks:
  hobbie-network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
    driver: local
