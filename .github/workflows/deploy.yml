name: Deploy to Production

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Deploy to ECS
      run: |
        # Update ECS service with new image
        aws ecs update-service \
          --cluster hobbie-cluster \
          --service hobbie-frontend-service \
          --force-new-deployment
          
        aws ecs update-service \
          --cluster hobbie-cluster \
          --service hobbie-backend-service \
          --force-new-deployment
          
    - name: Wait for deployment
      run: |
        # Wait for services to stabilize
        aws ecs wait services-stable \
          --cluster hobbie-cluster \
          --services hobbie-frontend-service hobbie-backend-service
          
    - name: Run smoke tests
      run: |
        # Basic smoke tests
        curl -f http://your-frontend-url/health || exit 1
        curl -f http://your-backend-url/actuator/health || exit 1
        
    - name: Notify Slack
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: |
          Deployment to ${{ github.event.inputs.environment || 'staging' }} ${{ job.status }}
          Commit: ${{ github.sha }}
          Tag: ${{ github.ref_name }}
